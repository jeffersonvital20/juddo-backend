name: Judoo Backend - CI/CD Pipeline

on:
  push:
    branches:
      - main
      - homolog
      - dev
  pull_request:
    branches:
      - main
      - homolog
      - dev

env:
  DOTNET_VERSION: '8.0.x'
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ============================================================================
  # 1. ETAPA DE BUILD, TESTES (UNITÁRIOS + INTEGRAÇÃO) E VALIDAÇÃO DOCKER
  # ============================================================================
  build-and-test:
    name: Build & Testes (.NET 8)
    runs-on: ubuntu-latest

    env:
      ASPNETCORE_ENVIRONMENT: Development
      POSTGRES_HOST: ${{ secrets.POSTGRES_HOST || 'localhost' }}
      POSTGRES_PORT: ${{ secrets.POSTGRES_PORT || '5433' }}
      POSTGRES_DB: ${{ secrets.POSTGRES_DB_DEV || 'judoo_db_dev' }}
      POSTGRES_USER: ${{ secrets.POSTGRES_USER || 'judoo_user' }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD || 'judoo_secret' }}
      Jwt__Key: ${{ secrets.JWT_KEY || 'JudooSuperSecretKeyForJwtAuthentication2026!' }}
      Jwt__Issuer: ${{ secrets.JWT_ISSUER || 'Judoo.Api' }}
      Jwt__Audience: ${{ secrets.JWT_AUDIENCE || 'Judoo.Clients' }}

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar .NET SDK ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache de pacotes NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restaurar dependências
        run: dotnet restore Judoo.sln

      - name: Compilar solução (Release)
        run: dotnet build Judoo.sln --configuration Release --no-restore

      - name: Executar Testes Unitários e de Integração (com Cobertura)
        run: dotnet test Judoo.sln --configuration Release --no-build --verbosity normal --settings coverlet.runsettings --logger "trx;LogFileName=test-results.trx"

      - name: Publicar Artefato da API
        run: dotnet publish src/Judoo.Api/Judoo.Api.csproj --configuration Release --no-build --output ./publish

      - name: Upload do Artefato Publicado
        uses: actions/upload-artifact@v4
        with:
          name: judoo-api-release
          path: ./publish
          retention-days: 7

      - name: Validar Build da Imagem Docker
        run: docker build -t judoo-api:ci-${{ github.sha }} .

  # ============================================================================
  # 2. DEPLOY AMBIENTE DE DESENVOLVIMENTO (Apenas push na branch 'dev')
  # ============================================================================
  deploy-dev:
    name: Deploy - Desenvolvimento (dev)
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    environment:
      name: development
    permissions:
      contents: read
      packages: write

    env:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      API_PORT: ${{ secrets.API_PORT || '8080' }}
      POSTGRES_HOST: ${{ secrets.POSTGRES_HOST || 'postgres' }}
      POSTGRES_PORT: ${{ secrets.POSTGRES_PORT || '5433' }}
      POSTGRES_DB: ${{ secrets.POSTGRES_DB_DEV || 'judoo_db_dev' }}
      POSTGRES_USER: ${{ secrets.POSTGRES_USER || 'judoo_user' }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD || 'judoo_secret' }}
      ConnectionStrings__DefaultConnection: ${{ secrets.DB_CONNECTION_STRING_DEV || format('Host={0};Port=5432;Database={1};Username={2};Password={3};', secrets.POSTGRES_HOST || 'postgres', secrets.POSTGRES_DB_DEV || 'judoo_db_dev', secrets.POSTGRES_USER || 'judoo_user', secrets.POSTGRES_PASSWORD || 'judoo_secret') }}
      Jwt__Key: ${{ secrets.JWT_KEY || 'JudooSuperSecretKeyForJwtAuthentication2026!' }}
      Jwt__Issuer: ${{ secrets.JWT_ISSUER || 'Judoo.Api' }}
      Jwt__Audience: ${{ secrets.JWT_AUDIENCE || 'Judoo.Clients' }}
      Swagger__Enabled: "true"
      Swagger__RoutePrefix: ""
      Security__SeedDemoUsers: "true"

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Gerar arquivo .env de Desenvolvimento a partir das Secrets
        run: |
          cat <<EOF > .env
          ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT}
          ASPNETCORE_URLS=${ASPNETCORE_URLS}
          API_PORT=${API_PORT}
          POSTGRES_HOST=${POSTGRES_HOST}
          POSTGRES_PORT=${POSTGRES_PORT}
          POSTGRES_DB=${POSTGRES_DB}
          POSTGRES_USER=${POSTGRES_USER}
          POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
          ConnectionStrings__DefaultConnection=${ConnectionStrings__DefaultConnection}
          JWT_KEY=${Jwt__Key}
          JWT_ISSUER=${Jwt__Issuer}
          JWT_AUDIENCE=${Jwt__Audience}
          Swagger__Enabled=${Swagger__Enabled}
          Swagger__RoutePrefix=${Swagger__RoutePrefix}
          Security__SeedDemoUsers=${Security__SeedDemoUsers}
          EOF

      - name: Download do Artefato da API
        uses: actions/download-artifact@v4
        with:
          name: judoo-api-release
          path: ./publish

      - name: Login no GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e Push da Imagem Docker (Dev)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dev
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dev-${{ github.sha }}

      - name: Resumo do Deploy (Dev)
        run: |
          echo "### 🚀 Deploy para Desenvolvimento Concluído" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: \`dev\`" >> $GITHUB_STEP_SUMMARY
          echo "- **ASPNETCORE_ENVIRONMENT**: \`${ASPNETCORE_ENVIRONMENT}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Database**: \`${POSTGRES_DB}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Imagem**: \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dev\`" >> $GITHUB_STEP_SUMMARY

  # ============================================================================
  # 3. DEPLOY AMBIENTE DE HOMOLOGAÇÃO (Apenas push na branch 'homolog')
  # ============================================================================
  deploy-homolog:
    name: Deploy - Homologação (homolog)
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/homolog'
    runs-on: ubuntu-latest
    environment:
      name: homologacao
    permissions:
      contents: read
      packages: write

    env:
      ASPNETCORE_ENVIRONMENT: Staging
      ASPNETCORE_URLS: http://+:8080
      API_PORT: ${{ secrets.API_PORT || '8080' }}
      POSTGRES_HOST: ${{ secrets.POSTGRES_HOST || 'postgres' }}
      POSTGRES_PORT: ${{ secrets.POSTGRES_PORT || '5432' }}
      POSTGRES_DB: ${{ secrets.POSTGRES_DB_STAGING || 'judoo_db_staging' }}
      POSTGRES_USER: ${{ secrets.POSTGRES_USER || 'judoo_user' }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD || 'judoo_secret' }}
      ConnectionStrings__DefaultConnection: ${{ secrets.DB_CONNECTION_STRING_STAGING || format('Host={0};Port=5432;Database={1};Username={2};Password={3};', secrets.POSTGRES_HOST || 'postgres', secrets.POSTGRES_DB_STAGING || 'judoo_db_staging', secrets.POSTGRES_USER || 'judoo_user', secrets.POSTGRES_PASSWORD || 'judoo_secret') }}
      Jwt__Key: ${{ secrets.JWT_KEY || 'JudooSuperSecretKeyForJwtAuthentication2026!' }}
      Jwt__Issuer: ${{ secrets.JWT_ISSUER || 'Judoo.Api' }}
      Jwt__Audience: ${{ secrets.JWT_AUDIENCE || 'Judoo.Clients' }}
      Swagger__Enabled: "true"
      Swagger__RoutePrefix: "swagger"
      Security__SeedDemoUsers: "true"

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Gerar arquivo .env de Homologação a partir das Secrets
        run: |
          cat <<EOF > .env
          ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT}
          ASPNETCORE_URLS=${ASPNETCORE_URLS}
          API_PORT=${API_PORT}
          POSTGRES_HOST=${POSTGRES_HOST}
          POSTGRES_PORT=${POSTGRES_PORT}
          POSTGRES_DB=${POSTGRES_DB}
          POSTGRES_USER=${POSTGRES_USER}
          POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
          ConnectionStrings__DefaultConnection=${ConnectionStrings__DefaultConnection}
          JWT_KEY=${Jwt__Key}
          JWT_ISSUER=${Jwt__Issuer}
          JWT_AUDIENCE=${Jwt__Audience}
          Swagger__Enabled=${Swagger__Enabled}
          Swagger__RoutePrefix=${Swagger__RoutePrefix}
          Security__SeedDemoUsers=${Security__SeedDemoUsers}
          EOF

      - name: Download do Artefato da API
        uses: actions/download-artifact@v4
        with:
          name: judoo-api-release
          path: ./publish

      - name: Login no GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e Push da Imagem Docker (Homologação)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:homolog
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:homolog-${{ github.sha }}

      - name: Resumo do Deploy (Homologação)
        run: |
          echo "### 🧪 Deploy para Homologação Concluído" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: \`homolog\`" >> $GITHUB_STEP_SUMMARY
          echo "- **ASPNETCORE_ENVIRONMENT**: \`${ASPNETCORE_ENVIRONMENT}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Database**: \`${POSTGRES_DB}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Imagem**: \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:homolog\`" >> $GITHUB_STEP_SUMMARY

  # ============================================================================
  # 4. DEPLOY AMBIENTE DE PRODUÇÃO (Somente em commit/push na branch 'main')
  # ============================================================================
  deploy-prod:
    name: Deploy - Produção (main)
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
    permissions:
      contents: read
      packages: write

    env:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      API_PORT: ${{ secrets.API_PORT || '8080' }}
      POSTGRES_HOST: ${{ secrets.POSTGRES_HOST || 'postgres' }}
      POSTGRES_PORT: ${{ secrets.POSTGRES_PORT || '5432' }}
      POSTGRES_DB: ${{ secrets.POSTGRES_DB_PROD || 'judoo_db_prod' }}
      POSTGRES_USER: ${{ secrets.POSTGRES_USER || 'judoo_user' }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD || 'judoo_secret' }}
      ConnectionStrings__DefaultConnection: ${{ secrets.DB_CONNECTION_STRING_PROD || format('Host={0};Port=5432;Database={1};Username={2};Password={3};', secrets.POSTGRES_HOST || 'postgres', secrets.POSTGRES_DB_PROD || 'judoo_db_prod', secrets.POSTGRES_USER || 'judoo_user', secrets.POSTGRES_PASSWORD || 'judoo_secret') }}
      Jwt__Key: ${{ secrets.JWT_KEY || 'JudooSuperSecretKeyForJwtAuthentication2026!' }}
      Jwt__Issuer: ${{ secrets.JWT_ISSUER || 'Judoo.Api' }}
      Jwt__Audience: ${{ secrets.JWT_AUDIENCE || 'Judoo.Clients' }}
      Swagger__Enabled: "false"
      Swagger__RoutePrefix: "swagger"
      Security__SeedDemoUsers: "false"

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Gerar arquivo .env de Produção a partir das Secrets
        run: |
          cat <<EOF > .env
          ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT}
          ASPNETCORE_URLS=${ASPNETCORE_URLS}
          API_PORT=${API_PORT}
          POSTGRES_HOST=${POSTGRES_HOST}
          POSTGRES_PORT=${POSTGRES_PORT}
          POSTGRES_DB=${POSTGRES_DB}
          POSTGRES_USER=${POSTGRES_USER}
          POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
          ConnectionStrings__DefaultConnection=${ConnectionStrings__DefaultConnection}
          JWT_KEY=${Jwt__Key}
          JWT_ISSUER=${Jwt__Issuer}
          JWT_AUDIENCE=${Jwt__Audience}
          Swagger__Enabled=${Swagger__Enabled}
          Swagger__RoutePrefix=${Swagger__RoutePrefix}
          Security__SeedDemoUsers=${Security__SeedDemoUsers}
          EOF

      - name: Download do Artefato da API
        uses: actions/download-artifact@v4
        with:
          name: judoo-api-release
          path: ./publish

      - name: Login no GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e Push da Imagem Docker (Produção)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:prod-${{ github.sha }}

      - name: Resumo do Deploy (Produção)
        run: |
          echo "### 🏆 Deploy para Produção Concluído" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: \`main\`" >> $GITHUB_STEP_SUMMARY
          echo "- **ASPNETCORE_ENVIRONMENT**: \`${ASPNETCORE_ENVIRONMENT}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Database**: \`${POSTGRES_DB}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Imagem**: \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest\`" >> $GITHUB_STEP_SUMMARY
