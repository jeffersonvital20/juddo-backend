name: Judoo Backend - CI/CD Pipeline (GCP Compute Engine VPS)

on:
  push:
    branches:
      - main
      - homolog
      - dev
  pull_request:
    branches:
      - main
      - homolog
      - dev

env:
  DOTNET_VERSION: '8.0.x'
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # ============================================================================
  # 1. ESTÁGIO DE BUILD (Restauração, Compilação, Publicação e Validação Docker)
  # ============================================================================
  build:
    name: 1. Build (.NET 8 & Docker)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar .NET SDK ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache de pacotes NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restaurar dependências
        run: dotnet restore Judoo.sln

      - name: Compilar solução (Release)
        run: dotnet build Judoo.sln --configuration Release --no-restore

      - name: Publicar Artefato da API
        run: dotnet publish src/Judoo.Api/Judoo.Api.csproj --configuration Release --no-build --output ./publish

      - name: Upload do Artefato Publicado da API
        uses: actions/upload-artifact@v4
        with:
          name: judoo-api-release
          path: ./publish
          retention-days: 7

      - name: Validar Build da Imagem Docker
        run: docker build -t judoo-api:ci-${{ github.sha }} .

  # ============================================================================
  # 2. ESTÁGIO DE TESTES UNITÁRIOS (Domínio e Regras FIJ)
  # ============================================================================
  unit-tests:
    name: 2. Testes Unitários
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar .NET SDK ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache de pacotes NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Executar Testes Unitários (Judoo.Domain.UnitTests)
        run: >
          dotnet test tests/Judoo.Domain.UnitTests/Judoo.Domain.UnitTests.csproj
          --configuration Release
          --verbosity normal
          --settings coverlet.runsettings
          --logger "trx;LogFileName=unit-tests.trx"

      - name: Upload do Relatório de Testes Unitários e Cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-tests-results
          path: tests/Judoo.Domain.UnitTests/TestResults/
          retention-days: 7

  # ============================================================================
  # 3. ESTÁGIO DE TESTES DE INTEGRAÇÃO (API, CQRS, Repositórios e SignalR)
  # ============================================================================
  integration-tests:
    name: 3. Testes de Integração
    needs: unit-tests
    runs-on: ubuntu-latest

    env:
      ASPNETCORE_ENVIRONMENT: Development
      POSTGRES_HOST: ${{ secrets.POSTGRES_HOST || 'localhost' }}
      POSTGRES_PORT: ${{ secrets.POSTGRES_PORT || '5433' }}
      POSTGRES_DB: ${{ secrets.POSTGRES_DB_DEV || 'judoo_db_dev' }}
      POSTGRES_USER: ${{ secrets.POSTGRES_USER || 'judoo_user' }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD || 'judoo_secret' }}
      Jwt__Key: ${{ secrets.JWT_KEY || 'JudooSuperSecretKeyForJwtAuthentication2026!' }}
      Jwt__Issuer: ${{ secrets.JWT_ISSUER || 'Judoo.Api' }}
      Jwt__Audience: ${{ secrets.JWT_AUDIENCE || 'Judoo.Clients' }}

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar .NET SDK ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache de pacotes NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Executar Testes de Integração (Judoo.IntegrationTests)
        run: >
          dotnet test tests/Judoo.IntegrationTests/Judoo.IntegrationTests.csproj
          --configuration Release
          --verbosity normal
          --settings coverlet.runsettings
          --logger "trx;LogFileName=integration-tests.trx"

      - name: Upload do Relatório de Testes de Integração e Cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-tests-results
          path: tests/Judoo.IntegrationTests/TestResults/
          retention-days: 7

  # ============================================================================
  # 4. DEPLOY VPS GCP - DESENVOLVIMENTO (Apenas push na branch 'dev')
  # ============================================================================
  deploy-dev:
    name: 4. Deploy VPS GCP - Desenvolvimento (dev)
    needs: [build, unit-tests, integration-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    environment:
      name: development

    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER || 'ubuntu' }}
      VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
      ASPNETCORE_ENVIRONMENT: Development
      API_PORT: ${{ secrets.API_PORT_DEV || '8082' }}
      POSTGRES_PORT: ${{ secrets.POSTGRES_PORT_DEV || '5434' }}
      POSTGRES_DB: ${{ secrets.POSTGRES_DB_DEV || 'judoo_db_dev' }}
      POSTGRES_USER: ${{ secrets.POSTGRES_USER || 'judoo_user' }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD || 'judoo_secret' }}
      JWT_KEY: ${{ secrets.JWT_KEY || 'JudooSuperSecretKeyForJwtAuthentication2026!' }}
      JWT_ISSUER: ${{ secrets.JWT_ISSUER || 'Judoo.Api' }}
      JWT_AUDIENCE: ${{ secrets.JWT_AUDIENCE || 'Judoo.Clients' }}

    steps:
      - name: Deploy via SSH na VM do Google Cloud (Dev)
        if: env.VPS_HOST != ''
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ env.VPS_PORT }}
          script: |
            set -e
            mkdir -p /opt/judoo/dev
            if [ ! -d "/opt/judoo/dev/.git" ]; then
              git clone -b dev https://github.com/${{ github.repository }}.git /opt/judoo/dev
            fi
            cd /opt/judoo/dev
            git fetch origin dev
            git reset --hard origin/dev

            cat <<EOF > .env
            ASPNETCORE_ENVIRONMENT=${{ env.ASPNETCORE_ENVIRONMENT }}
            API_PORT=${{ env.API_PORT }}
            POSTGRES_PORT=${{ env.POSTGRES_PORT }}
            POSTGRES_DB=${{ env.POSTGRES_DB }}
            POSTGRES_USER=${{ env.POSTGRES_USER }}
            POSTGRES_PASSWORD=${{ env.POSTGRES_PASSWORD }}
            JWT_KEY=${{ env.JWT_KEY }}
            JWT_ISSUER=${{ env.JWT_ISSUER }}
            JWT_AUDIENCE=${{ env.JWT_AUDIENCE }}
            EOF

            docker compose -p judoo-dev up -d --build --remove-orphans
            docker image prune -f

      - name: Resumo do Deploy (Dev)
        run: |
          echo "### 🚀 Deploy VPS GCP (Desenvolvimento) Concluído" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: \`dev\`" >> $GITHUB_STEP_SUMMARY
          echo "- **URL API Dev**: \`http://${{ env.VPS_HOST || 'SEU_IP_VM' }}:${{ env.API_PORT }}\`" >> $GITHUB_STEP_SUMMARY

  # ============================================================================
  # 5. DEPLOY VPS GCP - HOMOLOGAÇÃO (Apenas push na branch 'homolog')
  # ============================================================================
  deploy-homolog:
    name: 4. Deploy VPS GCP - Homologação (homolog)
    needs: [build, unit-tests, integration-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/homolog'
    runs-on: ubuntu-latest
    environment:
      name: homologacao

    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER || 'ubuntu' }}
      VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
      ASPNETCORE_ENVIRONMENT: Staging
      API_PORT: ${{ secrets.API_PORT_STAGING || '8081' }}
      POSTGRES_PORT: ${{ secrets.POSTGRES_PORT_STAGING || '5433' }}
      POSTGRES_DB: ${{ secrets.POSTGRES_DB_STAGING || 'judoo_db_staging' }}
      POSTGRES_USER: ${{ secrets.POSTGRES_USER || 'judoo_user' }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD || 'judoo_secret' }}
      JWT_KEY: ${{ secrets.JWT_KEY || 'JudooSuperSecretKeyForJwtAuthentication2026!' }}
      JWT_ISSUER: ${{ secrets.JWT_ISSUER || 'Judoo.Api' }}
      JWT_AUDIENCE: ${{ secrets.JWT_AUDIENCE || 'Judoo.Clients' }}

    steps:
      - name: Deploy via SSH na VM do Google Cloud (Homologação)
        if: env.VPS_HOST != ''
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ env.VPS_PORT }}
          script: |
            set -e
            mkdir -p /opt/judoo/homolog
            if [ ! -d "/opt/judoo/homolog/.git" ]; then
              git clone -b homolog https://github.com/${{ github.repository }}.git /opt/judoo/homolog
            fi
            cd /opt/judoo/homolog
            git fetch origin homolog
            git reset --hard origin/homolog

            cat <<EOF > .env
            ASPNETCORE_ENVIRONMENT=${{ env.ASPNETCORE_ENVIRONMENT }}
            API_PORT=${{ env.API_PORT }}
            POSTGRES_PORT=${{ env.POSTGRES_PORT }}
            POSTGRES_DB=${{ env.POSTGRES_DB }}
            POSTGRES_USER=${{ env.POSTGRES_USER }}
            POSTGRES_PASSWORD=${{ env.POSTGRES_PASSWORD }}
            JWT_KEY=${{ env.JWT_KEY }}
            JWT_ISSUER=${{ env.JWT_ISSUER }}
            JWT_AUDIENCE=${{ env.JWT_AUDIENCE }}
            EOF

            docker compose -p judoo-homolog up -d --build --remove-orphans
            docker image prune -f

      - name: Resumo do Deploy (Homologação)
        run: |
          echo "### 🧪 Deploy VPS GCP (Homologação) Concluído" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: \`homolog\`" >> $GITHUB_STEP_SUMMARY
          echo "- **URL API Homologação**: \`http://${{ env.VPS_HOST || 'SEU_IP_VM' }}:${{ env.API_PORT }}/swagger\`" >> $GITHUB_STEP_SUMMARY

  # ============================================================================
  # 6. DEPLOY VPS GCP - PRODUÇÃO (Somente em commit/push na branch 'main')
  # ============================================================================
  deploy-prod:
    name: 4. Deploy VPS GCP - Produção (main)
    needs: [build, unit-tests, integration-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production

    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER || 'ubuntu' }}
      VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
      ASPNETCORE_ENVIRONMENT: Production
      API_PORT: ${{ secrets.API_PORT_PROD || '8080' }}
      POSTGRES_PORT: ${{ secrets.POSTGRES_PORT_PROD || '5432' }}
      POSTGRES_DB: ${{ secrets.POSTGRES_DB_PROD || 'judoo_db_prod' }}
      POSTGRES_USER: ${{ secrets.POSTGRES_USER || 'judoo_user' }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD || 'judoo_secret' }}
      JWT_KEY: ${{ secrets.JWT_KEY || 'JudooSuperSecretKeyForJwtAuthentication2026!' }}
      JWT_ISSUER: ${{ secrets.JWT_ISSUER || 'Judoo.Api' }}
      JWT_AUDIENCE: ${{ secrets.JWT_AUDIENCE || 'Judoo.Clients' }}

    steps:
      - name: Deploy via SSH na VM do Google Cloud (Produção)
        if: env.VPS_HOST != ''
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ env.VPS_PORT }}
          script: |
            set -e
            mkdir -p /opt/judoo/prod
            if [ ! -d "/opt/judoo/prod/.git" ]; then
              git clone -b main https://github.com/${{ github.repository }}.git /opt/judoo/prod
            fi
            cd /opt/judoo/prod
            git fetch origin main
            git reset --hard origin/main

            cat <<EOF > .env
            ASPNETCORE_ENVIRONMENT=${{ env.ASPNETCORE_ENVIRONMENT }}
            API_PORT=${{ env.API_PORT }}
            POSTGRES_PORT=${{ env.POSTGRES_PORT }}
            POSTGRES_DB=${{ env.POSTGRES_DB }}
            POSTGRES_USER=${{ env.POSTGRES_USER }}
            POSTGRES_PASSWORD=${{ env.POSTGRES_PASSWORD }}
            JWT_KEY=${{ env.JWT_KEY }}
            JWT_ISSUER=${{ env.JWT_ISSUER }}
            JWT_AUDIENCE=${{ env.JWT_AUDIENCE }}
            EOF

            docker compose -p judoo-prod up -d --build --remove-orphans
            docker image prune -f

      - name: Resumo do Deploy (Produção)
        run: |
          echo "### 🏆 Deploy VPS GCP (Produção) Concluído" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: \`main\`" >> $GITHUB_STEP_SUMMARY
          echo "- **URL API Produção**: \`http://${{ env.VPS_HOST || 'SEU_IP_VM' }}:${{ env.API_PORT }}\`" >> $GITHUB_STEP_SUMMARY
